<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0e1a; --card: rgba(30,41,59,.85); --card-solid: #1e293b;
    --border: rgba(148,163,184,.12); --text: #f1f5f9; --text-dim: #94a3b8;
    --primary: #6366f1; --primary-2: #8b5cf6; --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
  }
  body {
    font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 1.5rem 1rem 3rem;
    background-image: linear-gradient(rgba(10,14,26,.88), rgba(10,14,26,.92)), url('https://i.hizliresim.com/loreuqk4.jpg');
    background-size: cover; background-position: center; background-attachment: fixed;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  .hidden { display: none !important; }
  .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; padding: 1.25rem 1.5rem; background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 1.25rem; }
  .logo { display: flex; align-items: center; gap: .85rem; }
  .logo-icon { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; border: 2px solid #ef4444; }
  .logo-text h1 { font-size: 1.2rem; font-weight: 800; }
  .logo-text p { font-size: .72rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .btn { background: var(--card-solid); border: 1px solid var(--border); border-radius: .65rem; padding: .55rem 1rem; cursor: pointer; font-weight: 600; font-size: .82rem; color: var(--text); font-family: inherit; }
  .btn.danger { color: #fca5a5; border-color: rgba(239,68,68,.35); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .85rem; margin-bottom: 1.5rem; }
  .stat { background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 1rem; padding: 1rem 1.1rem; }
  .stat .label { font-size: .68rem; color: var(--text-dim); font-weight: 600; text-transform: uppercase; margin-bottom: .4rem; }
  .stat .value { font-size: 1.6rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
  .stat .value.purple { background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .stat .value.green { color: #86efac; }
  .stat .value.red { color: #fca5a5; }
  .stat .value.yellow { color: #fcd34d; }
  .stat .value.vip { color: #f59e0b; }
  .panel { background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 1.25rem; padding: 1.5rem; margin-bottom: 1.5rem; }
  .panel-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: .5rem; }
  .panel-title::before { content: ""; width: 4px; height: 18px; background: linear-gradient(180deg, #ef4444, #f97316); border-radius: 4px; }
  .user-row { display: flex; align-items: center; gap: 1rem; padding: .85rem 1rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .user-row:last-child { border-bottom: none; }
  .user-avatar { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; object-fit: cover; border: 2px solid var(--border); }
  .user-info { flex: 1; min-width: 180px; }
  .user-name { font-weight: 700; font-size: .92rem; display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; }
  .tick { color: #60a5fa; font-size: .85rem; }
  .rank-badge { font-size: .65rem; font-weight: 700; padding: .18rem .5rem; border-radius: 999px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; text-transform: uppercase; }
  .rank-badge.admin { background: linear-gradient(135deg, #ef4444, #f97316); }
  .rank-badge.vip { background: linear-gradient(135deg, #f59e0b, #ef4444); }
  .user-meta { font-size: .72rem; color: var(--text-dim); margin-top: .15rem; }
  .status { font-size: .72rem; font-weight: 700; display: inline-flex; align-items: center; gap: .35rem; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; }
  .status.online { color: #86efac; }
  .status.online .dot { background: #10b981; box-shadow: 0 0 8px #10b981; }
  .status.offline { color: #64748b; }
  .status.offline .dot { background: #64748b; }
  .status.banned { color: #fca5a5; }
  .status.banned .dot { background: #ef4444; }
  .user-actions { display: flex; gap: .4rem; flex-wrap: wrap; }
  .btn-sm { padding: .4rem .7rem; border-radius: .5rem; font-size: .72rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--card-solid); color: var(--text); font-family: inherit; }
  .btn-sm.danger { color: #fca5a5; border-color: rgba(239,68,68,.3); }
  .btn-sm.success { color: #86efac; border-color: rgba(16,185,129,.3); }
  .btn-sm.warn { color: #fcd34d; border-color: rgba(245,158,11,.3); }
  .btn-sm.vip { color: #f59e0b; border-color: rgba(245,158,11,.5); }
  .toast { position: fixed; bottom: 24px; right: 24px; padding: .85rem 1.2rem; background: var(--card-solid); border: 1px solid var(--primary); border-radius: .75rem; color: var(--text); font-size: .85rem; font-weight: 600; opacity: 0; transform: translateY(12px); transition: all .3s; pointer-events: none; z-index: 999; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { border-color: var(--danger); }
  .toast.success { border-color: var(--success); }
</style>
</head>
<body>

<div id="unauthView" class="container hidden">
  <div class="panel" style="text-align:center;padding:3rem 2rem;">
    <div style="font-size:3rem;margin-bottom:1rem;">🛡️</div>
    <h2 style="margin-bottom:.5rem;">Yetkisiz Erişim</h2>
    <a href="adminlogin.html" class="btn danger" style="display:inline-block;text-decoration:none;padding:.7rem 1.5rem;">🛡️ Admin Girişi</a>
  </div>
</div>

<div id="adminView" class="container hidden">
  <div class="header">
    <div class="logo">
      <img class="logo-icon" src="https://i.hizliresim.com/midnihxu.jpg" alt="">
      <div class="logo-text"><h1>Admin Panel</h1><p>Forex Sorgulama</p></div>
    </div>
    <div style="display:flex;gap:.5rem;">
      <button class="btn" onclick="loadStats()">🔄 Yenile</button>
      <button class="btn" onclick="location.href='index.html'">🏠 Ana Sayfa</button>
      <button class="btn danger" onclick="logout()">🚪 Çıkış</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="panel">
    <div class="panel-title">👥 Kullanıcılar</div>
    <div id="userList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ADMIN_API = 'admin.php';
const DEFAULT_AVATAR = 'https://i.hizliresim.com/midnihxu.jpg';

function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast', 2200);
}
function esc(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function avatarOf(u) { return (u.avatar && !u.avatar.includes('ui-avatars.com')) ? u.avatar : DEFAULT_AVATAR; }

async function api(action, params = {}) {
  const fd = new FormData();
  fd.append('action', action);
  for (const [k, v] of Object.entries(params)) fd.append(k, v);
  const r = await fetch(ADMIN_API, { method: 'POST', body: fd });
  return r.json();
}

async function checkSession() {
  const r = await fetch(ADMIN_API + '?action=admin_check');
  const d = await r.json();
  if (d.success && d.logged) {
    document.getElementById('adminView').classList.remove('hidden');
    document.getElementById('unauthView').classList.add('hidden');
    loadStats();
    loadUsers();
  } else {
    document.getElementById('adminView').classList.add('hidden');
    document.getElementById('unauthView').classList.remove('hidden');
  }
}

async function loadStats() {
  const d = await api('stats');
  if (!d.success) return;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="label">Toplam</div><div class="value purple">${d.total}</div></div>
    <div class="stat"><div class="label">Çevrimiçi</div><div class="value green">${d.online}</div></div>
    <div class="stat"><div class="label">VIP</div><div class="value vip">${d.vip}</div></div>
    <div class="stat"><div class="label">Doğrulanmış</div><div class="value yellow">${d.verified}</div></div>
    <div class="stat"><div class="label">Banlı</div><div class="value red">${d.banned}</div></div>
    <div class="stat"><div class="label">Mesaj</div><div class="value purple">${d.messages}</div></div>
    <div class="stat"><div class="label">AI Mesaj</div><div class="value purple">${d.ai_messages || 0}</div></div>
  `;
}

async function loadUsers() {
  const d = await api('list_users');
  if (!d.success) return;
  const list = d.users.sort((a, b) => (b.online - a.online) || a.username.localeCompare(b.username));

  let html = '';
  for (const u of list) {
    const status = u.banned
      ? '<span class="status banned"><span class="dot"></span> BANLI</span>'
      : u.online
        ? '<span class="status online"><span class="dot"></span> Çevrimiçi</span>'
        : '<span class="status offline"><span class="dot"></span> Çevrimdışı</span>';

    const tick = u.verified ? '<span class="tick">✅</span>' : '';
    let rankCls = '';
    if (u.is_admin) rankCls = 'admin';
    else if (u.is_vip || u.rank === 'VIP') rankCls = 'vip';
    const lastSeen = u.last_seen ? new Date(u.last_seen).toLocaleString('tr-TR') : '-';

    html += `
      <div class="user-row">
        <img class="user-avatar" src="${esc(avatarOf(u))}" alt="">
        <div class="user-info">
          <div class="user-name">
            ${esc(u.username)} ${tick}
            <span class="rank-badge ${rankCls}">${esc(u.rank)}</span>
            ${u.is_admin ? '<span class="rank-badge admin">ADMIN</span>' : ''}
            ${u.is_vip && !u.is_admin ? '<span class="rank-badge vip">VIP</span>' : ''}
          </div>
          <div class="user-meta">${esc(u.email || '-')} · Son: ${lastSeen}</div>
          <div style="margin-top:.3rem;">${status}</div>
        </div>
        <div class="user-actions">
          ${!u.is_admin ? `
            <button class="btn-sm ${u.verified ? 'warn' : 'success'}" onclick="toggleVerify('${u.id}', ${u.verified ? 0 : 1})">
              ${u.verified ? '❌ Tik' : '✅ Tik'}
            </button>
            <button class="btn-sm ${u.is_vip ? 'warn' : 'vip'}" onclick="toggleVIP('${u.id}', ${u.is_vip ? 0 : 1})">
              ${u.is_vip ? '❌ VIP' : '💎 VIP'}
            </button>
            <button class="btn-sm ${u.banned ? 'success' : 'danger'}" onclick="toggleBan('${u.id}', ${u.banned ? 0 : 1})">
              ${u.banned ? '✅ Ban Kaldır' : '🚫 Banla'}
            </button>
            <button class="btn-sm warn" onclick="setRank('${u.id}', '${esc(u.rank)}')">🏅 Rütbe</button>
            <button class="btn-sm danger" onclick="delUser('${u.id}', '${esc(u.username)}')">🗑️ Sil</button>
          ` : '<span style="color:var(--text-dim);font-size:.75rem;">(admin)</span>'}
        </div>
      </div>
    `;
  }
  document.getElementById('userList').innerHTML = html || '<p style="color:var(--text-dim);text-align:center;padding:2rem;">Kayıtlı kullanıcı yok</p>';
}

async function toggleVerify(id, v) {
  const d = await api('verify', { id, verified: v });
  toast(d.message || 'Tamam', d.success ? 'success' : 'error');
  loadUsers(); loadStats();
}
async function toggleVIP(id, v) {
  const d = await api('vip', { id, vip: v });
  toast(d.message || 'Tamam', d.success ? 'success' : 'error');
  loadUsers(); loadStats();
}
async function toggleBan(id, v) {
  if (v && !confirm('Banlamak istediğine emin misin?')) return;
  const d = await api('ban', { id, ban: v });
  toast(d.message || 'Tamam', d.success ? 'success' : 'error');
  loadUsers(); loadStats();
}
async function setRank(id, current) {
  const rank = prompt('Yeni rütbe:', current);
  if (rank === null || rank.trim() === '') return;
  const d = await api('set_rank', { id, rank: rank.trim() });
  toast(d.message || 'Tamam', d.success ? 'success' : 'error');
  loadUsers();
}
async function delUser(id, username) {
  if (!confirm(`"${username}" silinsin mi?`)) return;
  const d = await api('delete_user', { id });
  toast(d.message || 'Tamam', d.success ? 'success' : 'error');
  loadUsers(); loadStats();
}
async function logout() {
  await fetch('auth.php?action=logout');
  location.href = 'adminlogin.html';
}

setInterval(() => { if (!document.getElementById('adminView').classList.contains('hidden')) loadUsers(); }, 30000);
checkSession();
</script>
</body>
</html>
